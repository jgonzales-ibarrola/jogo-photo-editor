[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jogo-photo-editor"
version = "0.1.0"
description = "Automatic photo editor for iPhone HEIC and ProRAW (DNG) files, with plain-language guides."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "rawpy>=0.21",
    "tifffile>=2023.1",
    "opencv-python-headless>=4.8,<5",  # face detection for the skin tone check
]

[project.optional-dependencies]
dev = ["pytest>=8"]
score = ["torch>=2.4", "torchvision>=0.19", "pyiqa>=0.1.13"]

[project.scripts]
jogo = "jogo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jogo = ["presets/*.toml"]
